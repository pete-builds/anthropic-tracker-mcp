name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lockfile-drift:
    name: Lockfile drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Re-compile requirements.lock
        run: |
          uv pip compile requirements.txt \
            -o requirements.lock.regen \
            --generate-hashes \
            --python-version 3.13 \
            --no-header \
            --quiet

      - name: Fail if requirements.lock drifted from requirements.txt
        run: |
          set -e
          if ! diff -q <(tail -n +3 requirements.lock) requirements.lock.regen > /dev/null; then
            echo "::error::requirements.lock is stale. Regenerate with: uv pip compile requirements.txt -o requirements.lock --generate-hashes --python-version 3.13"
            diff -u <(tail -n +3 requirements.lock) requirements.lock.regen | head -50 || true
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          pip install --require-hashes -r requirements.lock
          pip install ruff

      - name: Lint
        run: ruff check .

      - name: Import smoke test
        env:
          TRACKER_DB_PATH: /tmp/tracker.db
        run: |
          touch /tmp/tracker.db
          python -c "import server; import clients.tracker; import clients.greenhouse; import clients.parser"

  scan:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: anthropic-tracker-mcp:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: anthropic-tracker-mcp:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
